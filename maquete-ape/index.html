<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquete Blender do Apê</title>
<meta name="description" content="Maquete 3D do apartamento de 34,77 m²: troque acabamentos, mude os móveis e veja a luz ao longo do dia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --stage:#1f2723; --glass:rgba(24,30,27,.80); --glass-2:rgba(255,255,255,.06); --line:rgba(236,232,223,.13);
  --ink:#ece8df; --muted:#a6aea8; --sun:#f1b44c; --sun-ink:#231a0a; --moon:#9db8de;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:400 14px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.app{position:relative;height:100%}
.canvas-wrap{position:absolute;inset:0}
.canvas-wrap canvas{touch-action:none}
.bare .ui{display:none!important}

/* painéis flutuantes */
.ui{position:absolute;z-index:30;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.ui h2{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}

.leftcol{position:absolute;z-index:30;top:16px;left:16px;bottom:16px;width:300px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;pointer-events:none}
.leftcol>.ui{position:relative;pointer-events:auto;flex:0 0 auto}
.ident{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.ident h1{margin:0;font-size:30px;line-height:1;font-weight:700;letter-spacing:-.02em}
.ident p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.seg{display:flex;background:var(--glass-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;background:transparent;border:0;border-radius:7px;padding:7px 8px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:#1b211e}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--sun);width:16px;height:16px;margin:0}
.rooms{display:flex;flex-wrap:wrap;gap:6px}
.rooms button{background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.rooms button[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}

.mood{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.moods button{background:var(--glass-2);border:1px solid var(--line);border-radius:9px;padding:8px 4px;cursor:pointer;font-size:12.5px;font-weight:500}
.moods button:hover{border-color:rgba(241,180,76,.6)}
.moods .ghostbtn{grid-column:1/-1;background:transparent;color:var(--muted);padding:5px}
.meter{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--glass-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--muted);border-radius:3px;transition:width .5s ease}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.bar.top{color:var(--ink)}
.bar.top b{background:var(--sun)}

.daylight{top:16px;right:16px;width:272px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dlhead{display:flex;align-items:baseline;justify-content:space-between}
.clock{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--sun)}
.clock.night{color:var(--moon)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times button{position:relative;display:block;padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:#111;text-align:left}
.times canvas{display:block;width:100%;aspect-ratio:16/10;background:#26302c}
.times span{position:absolute;left:7px;bottom:5px;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.times em{position:absolute;right:7px;bottom:5px;font-size:11px;font-style:normal;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.times button[aria-pressed="true"]{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
input[type=range]{width:100%;accent-color:var(--sun);margin:2px 0}

.tools{top:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:12px}
.tools button{display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;background:transparent;border:0;border-radius:9px;cursor:pointer;color:var(--ink)}
.tools button:hover{background:var(--glass-2)}
.tools button[aria-pressed="true"]{background:var(--glass-2);color:var(--sun)}
.tools .mob{display:none;font-size:13px;font-weight:600}
.showui{position:absolute;top:14px;right:14px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--muted)}

/* bandeja de amostras */
.tray{left:50%;bottom:16px;transform:translateX(-50%);width:min(880px,calc(100% - 640px));min-width:520px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:0;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:#1b211e}
.tabs button.dim{opacity:.4}
.context{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:12.5px;color:var(--muted);min-height:18px}
.context b{color:var(--ink);font-weight:600}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--sun);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin}
.chip{flex:0 0 auto;width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.chip .sw,.chip canvas{display:block;width:62px;height:62px;border-radius:5px;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 1px 0 4px rgba(255,255,255,.04),0 8px 16px -8px rgba(0,0,0,.8);transition:transform .15s ease}
.chip:hover .sw,.chip:hover canvas{transform:translateY(-3px)}
.chip span{font-size:11.5px;line-height:1.2;text-align:center;color:var(--muted)}
.chip.on .sw{box-shadow:0 0 0 2px var(--sun),0 8px 16px -8px rgba(0,0,0,.8)}
.chip.on span{color:var(--ink)}
.chip.dim{opacity:.35}
.chip.piece{width:84px}
.chip.piece canvas{width:74px;height:74px;background:#33403b}

/* painel de medidas */
.measures{right:16px;bottom:16px;width:290px;max-height:calc(100% - 380px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start}
.mhead strong{display:block;font-size:17px;font-weight:700;margin-top:2px}
.mhead .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.now{margin:0;font-size:13px;color:var(--sun);font-variant-numeric:tabular-nums}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--glass-2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer}
.presets button span{font-size:12.5px;font-weight:600}
.presets button em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.presets button[aria-pressed="true"]{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.custom{display:flex;flex-direction:column;gap:6px}
.custom label{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.custom input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 14px/1 var(--sans);padding:7px 8px;font-variant-numeric:tabular-nums}
.custom em{font-style:normal;font-size:12px}
.opt{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.opt .seg{flex-wrap:wrap}
.opt .seg button{flex:1 1 auto;white-space:nowrap}
.seg.small button{padding:6px 8px;font-size:12.5px}

/* lâmpadas clicáveis */
.bulb{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--muted);cursor:pointer;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,color .2s,box-shadow .2s}
.bulb:hover{color:var(--ink);border-color:rgba(241,180,76,.7)}
.bulb.on{background:var(--sun);color:var(--sun-ink);border-color:var(--sun);box-shadow:0 0 0 4px rgba(241,180,76,.22),0 0 18px rgba(255,200,120,.55)}
.bulb.day{opacity:.7}

/* elementos presos à cena */
.lab{white-space:nowrap;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:600 12px/1.25 var(--sans);color:var(--ink);text-align:center}
.lab span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.sunlabel{font:700 12px/1 var(--sans);color:var(--sun-ink);background:var(--sun);border-radius:999px;padding:3px 7px;font-variant-numeric:tabular-nums}
.card{position:relative;display:flex;align-items:center;gap:7px;transform:translate(-50%,-100%) translateY(-34px);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:4px 9px 4px 4px;white-space:nowrap;box-shadow:0 10px 20px -12px rgba(0,0,0,.7)}
.card::after{content:"";position:absolute;left:50%;bottom:-35px;width:1px;height:34px;background:rgba(236,232,223,.5)}
.card .sw{border-radius:4px}
.card span{display:flex;flex-direction:column;font-size:10.5px;color:var(--muted);line-height:1.25}
.card b{font-size:12px;color:var(--ink);font-weight:600}
.piecemenu{pointer-events:auto;position:relative;transform:translateY(calc(-50% - 64px));display:flex;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 10px;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px}
.piecemenu::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:46px;background:rgba(241,180,76,.7);pointer-events:none}
.piecemenu strong{font-weight:600;margin-right:4px}
.piecemenu button{background:var(--glass-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12.5px}
.piecemenu button:hover{border-color:var(--sun)}
.piecemenu button[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
.piecemenu .x,.help .x{border:0;background:none;font-size:18px;line-height:1;padding:2px 6px;color:var(--muted)}

.ghost{display:none;position:fixed;left:0;top:0;pointer-events:none;z-index:50;margin:-31px 0 0 -31px}
.ghost canvas{width:62px;height:62px;border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 16px 30px -10px rgba(0,0,0,.8);transition:opacity .15s,transform .15s}
.ghost.ok canvas{box-shadow:0 0 0 2px var(--sun),0 16px 30px -10px rgba(0,0,0,.8);transform:scale(.8)}
.ghost[data-kind="piece"].ok canvas{opacity:.25}
.ghost.far canvas{opacity:.9}

.help{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;padding:18px 20px;z-index:40;display:flex;flex-direction:column;gap:12px}
.help .x{position:absolute;top:10px;right:10px;cursor:pointer}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.help dt{font-weight:600;white-space:nowrap}
.help dd{margin:0;color:var(--muted)}
.credits summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.credits p{margin-top:6px}
.toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);background:var(--ink);color:#1b211e;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;max-width:calc(100% - 32px);text-align:center;z-index:45}
.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted)}
.pad{position:absolute;right:16px;bottom:190px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button{background:var(--glass);border:1px solid var(--line);border-radius:10px;font:600 18px/1 var(--sans);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--sun);color:var(--sun-ink)}
.pad .up{grid-column:2;grid-row:1}.pad .tl{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .tr{grid-column:3;grid-row:2}

@media (max-width:1180px){
  .tray{width:auto;min-width:0;left:16px;right:16px;transform:none}
  .leftcol{bottom:200px}
  .measures{bottom:200px;max-height:calc(100% - 560px);min-height:220px}
  .daylight{width:236px}
  .times{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .leftcol{top:10px;left:10px;right:10px;width:auto;bottom:auto;overflow:visible}
  .ident{padding:10px 12px;gap:8px}
  .ident h1{font-size:22px}
  .ident p{display:none}
  .tools{top:auto;bottom:222px;left:10px;transform:none}
  .tools .mob{display:grid}
  .mood{display:none}
  .mood.open{position:fixed;left:10px;right:10px;bottom:272px;max-height:calc(100% - 380px);overflow:auto}
  .daylight{display:none;left:10px;right:10px;width:auto;top:auto;bottom:272px}
  .measures{left:10px;right:10px;width:auto;bottom:272px;max-height:calc(100% - 390px);min-height:0}
  .mood.open,.daylight.open{display:flex}
  .tray{left:10px;right:10px;bottom:10px;padding:8px 10px 10px}
  .context{font-size:12px}
  .toast{bottom:276px}
  .pad{bottom:276px}
  .walking .tray{display:none}
  .walking .tools{bottom:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* tela de abertura */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#26302b 0%,var(--stage) 60%,#161c19 100%);transition:opacity .6s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-in{width:min(340px,calc(100% - 48px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.splash .plan{width:min(220px,58vw);height:auto;margin-bottom:10px;overflow:visible}
.splash .plan rect{fill:rgba(241,180,76,.08);stroke:var(--sun);stroke-width:9;stroke-linejoin:round;stroke-dasharray:1;transition:stroke-dashoffset .5s ease,fill-opacity .6s ease}
.splash h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.splash .step{margin:2px 0 0;color:var(--ink);font-size:14px}
.splash .dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.splash .bar{width:100%;height:4px;border-radius:2px;background:var(--glass-2);overflow:hidden}
.splash .bar i{display:block;height:100%;background:var(--sun);transform-origin:left;transition:transform .35s ease}
.splash .detail{width:100%;display:flex;justify-content:space-between;margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.splash .err{margin:6px 0 0;color:#f0b7a8;font-size:13.5px;line-height:1.45}
@media (prefers-reduced-motion:reduce){.splash .dots::after{animation:none;content:"..."}}

/* montagem: a planta da abertura se abre e vira o piso; a interface entra quando o apê está pronto */
.splash.out .plan{transform:perspective(600px) rotateX(48deg) scale(2.6);opacity:0;transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .7s ease .1s}
.splash .plan{transition:transform .8s ease,opacity .6s ease}
.splash.out .splash-in>:not(.plan){opacity:0;transition:opacity .25s ease}
.app .ui{transition:opacity .5s ease}
.app.assembling .ui{opacity:0;pointer-events:none}
.skiphint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);margin:0;padding:7px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);color:var(--muted);font-size:12.5px;pointer-events:none;z-index:40;animation:hintin .5s ease .6s both}
@keyframes hintin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.splash.out .plan{transform:none}.skiphint{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
